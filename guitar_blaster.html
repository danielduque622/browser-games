<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guitar Blaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: crosshair;
      image-rendering: pixelated;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
const mouse = { x: W / 2, y: H / 2, fired: false };

// ─── Stars ────────────────────────────────────────────────────────────────────
const stars = Array.from({ length: 100 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  speed: Math.random() * 0.4 + 0.1, size: Math.random() * 1.5 + 0.5
}));

// ─── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, color, fast) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const spd = Math.random() * (fast ? 160 : 90) + 30;
    this.vx = Math.cos(a) * spd;
    this.vy = Math.sin(a) * spd;
    this.life = Math.random() * 0.5 + 0.25;
    this.maxLife = this.life;
    this.sz = Math.random() * 4 + 2;
    this.color = color;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vy += 50 * dt; this.vx *= 0.97; this.life -= dt;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.sz / 2, this.y - this.sz / 2, this.sz, this.sz);
    ctx.globalAlpha = 1;
  }
  dead() { return this.life <= 0; }
}

function burst(x, y, color, n, fast) {
  for (let i = 0; i < n; i++) particles.push(new Particle(x, y, color, fast));
}

// ─── Laser ────────────────────────────────────────────────────────────────────
class Laser {
  constructor(x, y, angle) {
    this.x = x; this.y = y;
    const spd = 620;
    this.vx = Math.cos(angle) * spd;
    this.vy = Math.sin(angle) * spd;
    this.r = 5;
    this.life = 2;
    this.trail = [];
  }
  update(dt) {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 10) this.trail.shift();
    this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt;
    if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) this.life = 0;
  }
  draw() {
    for (let i = 0; i < this.trail.length; i++) {
      const a = (i / this.trail.length) * 0.45;
      const s = (i / this.trail.length) * this.r * 2;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, s, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,0,220,${a})`;
      ctx.fill();
    }
    ctx.save();
    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff88ff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
  }
  dead() { return this.life <= 0; }
}

// ─── Player ───────────────────────────────────────────────────────────────────
class Player {
  constructor() {
    this.x = W / 2; this.y = H / 2;
    this.speed = 190;
    this.hp = 3; this.maxHp = 3;
    this.angle = 0;
    this.cooldown = 0;
    this.fireRate = 0.22;
    this.r = 13;
    this.iframes = 0;
    this.bobT = 0;
    this.fired = 0; this.hit = 0;
  }
  update(dt) {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']  || keys['a']) dx -= 1;
    if (keys['ArrowRight'] || keys['d']) dx += 1;
    if (keys['ArrowUp']    || keys['w']) dy -= 1;
    if (keys['ArrowDown']  || keys['s']) dy += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    this.x = clamp(this.x + dx * this.speed * dt, this.r, W - this.r);
    this.y = clamp(this.y + dy * this.speed * dt, this.r, H - this.r);
    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
    if (this.cooldown > 0) this.cooldown -= dt;
    if (this.iframes > 0) this.iframes -= dt;
    this.bobT += dt * (dx || dy ? 8 : 3);
  }
  shoot() {
    if (this.cooldown > 0) return null;
    this.cooldown = this.fireRate; this.fired++;
    const tx = this.x + Math.cos(this.angle) * 32;
    const ty = this.y + Math.sin(this.angle) * 32;
    return new Laser(tx, ty, this.angle);
  }
  damage() {
    if (this.iframes > 0) return false;
    this.hp--; this.iframes = 1.4;
    burst(this.x, this.y, '#e8c840', 8);
    return true;
  }
  draw() {
    if (this.iframes > 0 && Math.floor(this.iframes * 10) % 2) return;
    const bob = Math.sin(this.bobT) * 2;
    ctx.save(); ctx.translate(this.x, this.y + bob);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 16, 11, 5, 0, 0, Math.PI * 2); ctx.fill();

    // Legs
    ctx.fillStyle = '#2255aa';
    ctx.fillRect(-6, 6, 5, 10); ctx.fillRect(1, 6, 5, 10);
    // Boots
    ctx.fillStyle = '#112244';
    ctx.fillRect(-7, 14, 6, 4); ctx.fillRect(1, 14, 6, 4);
    // Torso
    ctx.fillStyle = '#d4b830';
    ctx.fillRect(-8, -5, 16, 13);
    ctx.fillStyle = '#a89020';
    ctx.fillRect(-2, -5, 4, 13);
    // Head
    ctx.fillStyle = '#f0c882';
    ctx.fillRect(-6, -17, 12, 13);
    // Hair
    ctx.fillStyle = '#1a0e04';
    ctx.fillRect(-7, -19, 14, 5);
    ctx.fillRect(-9, -17, 4, 4);
    ctx.fillRect(5,  -17, 4, 4);
    // Eyes
    ctx.fillStyle = '#111';
    ctx.fillRect(-4, -12, 3, 3); ctx.fillRect(1, -12, 3, 3);
    // Mouth smirk
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, -7, 4, 2);

    // Guitar-gun arm (rotates to face mouse)
    ctx.rotate(this.angle);
    // Forearm
    ctx.fillStyle = '#f0c882';
    ctx.fillRect(6, -3, 16, 5);
    // Guitar body (Stratocaster silhouette)
    ctx.fillStyle = '#cc2222';
    ctx.beginPath(); ctx.ellipse(30, 0, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ee3333';
    ctx.beginPath(); ctx.ellipse(27, -3, 6, 5, -0.3, 0, Math.PI * 2); ctx.fill();
    // Cutaway notch
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath(); ctx.ellipse(36, 4, 4, 3, 0.4, 0, Math.PI * 2); ctx.fill();
    // Pickguard
    ctx.fillStyle = '#fff9e0';
    ctx.beginPath(); ctx.ellipse(28, 1, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    // Neck
    ctx.fillStyle = '#7a5a18';
    ctx.fillRect(38, -2, 20, 4);
    // Frets
    ctx.strokeStyle = '#c8a84a'; ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(41 + i * 4, -2); ctx.lineTo(41 + i * 4, 2); ctx.stroke();
    }
    // Headstock
    ctx.fillStyle = '#5a4010';
    ctx.fillRect(57, -4, 8, 8);
    // Tuning pegs
    ctx.fillStyle = '#999';
    ctx.fillRect(64, -5, 4, 3); ctx.fillRect(64, 2, 4, 3);
    // Laser emitter (glowing tip)
    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff44ff';
    ctx.fillRect(62, -3, 6, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(63, -2, 4, 4);
    ctx.shadowBlur = 0;

    ctx.restore();
  }
}

// ─── Enemy ────────────────────────────────────────────────────────────────────
class Enemy {
  constructor(x, y, type, lvl) {
    this.x = x; this.y = y; this.type = type; this.lvl = lvl;
    this.animT = Math.random() * Math.PI * 2;
    this.angle = 0;

    if (type === 'grunt') {
      this.hp = this.maxHp = 1;
      this.spd = 58 + lvl * 11;
      this.r = 13; this.col = '#e74c3c'; this.pts = 10;
    } else if (type === 'charger') {
      this.hp = this.maxHp = 3;
      this.spd = 42 + lvl * 7;
      this.chargeSpd = 260 + lvl * 14;
      this.r = 14; this.col = '#e67e22'; this.pts = 25;
      this.buildup = 0; this.charging = false; this.chargeT = 0;
      this.chargeDir = { x: 0, y: 0 };
    } else if (type === 'swarmer') {
      this.hp = this.maxHp = 1;
      this.spd = 75 + lvl * 13;
      this.r = 9; this.col = '#9b59b6'; this.pts = 15;
      this.orbitA = Math.random() * Math.PI * 2;
      this.orbitPhase = 0;
    } else if (type === 'boss') {
      this.hp = this.maxHp = 12 + lvl * 2;
      this.spd = 48 + lvl * 4;
      this.r = 32; this.col = '#1abc9c'; this.pts = 250;
      this.phase = Math.random() * Math.PI * 2;
    }
  }

  update(dt, px, py) {
    this.animT += dt * 4;
    const dx = px - this.x, dy = py - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    this.angle = Math.atan2(dy, dx);

    if (this.type === 'grunt') {
      this.x += (dx / dist) * this.spd * dt;
      this.y += (dy / dist) * this.spd * dt;
    } else if (this.type === 'charger') {
      if (!this.charging) {
        this.x += (dx / dist) * this.spd * dt;
        this.y += (dy / dist) * this.spd * dt;
        this.buildup += dt;
        if (this.buildup > 2.2) {
          this.charging = true; this.chargeT = 0.55;
          this.chargeDir = { x: dx / dist, y: dy / dist };
        }
      } else {
        this.x += this.chargeDir.x * this.chargeSpd * dt;
        this.y += this.chargeDir.y * this.chargeSpd * dt;
        this.chargeT -= dt;
        if (this.chargeT <= 0) { this.charging = false; this.buildup = 0; }
      }
    } else if (this.type === 'swarmer') {
      this.orbitPhase += dt;
      if (this.orbitPhase < 1.2) {
        this.orbitA += dt * 3.5;
        const od = 180 - this.orbitPhase * 80;
        const tx = px + Math.cos(this.orbitA) * od;
        const ty = py + Math.sin(this.orbitA) * od;
        const tdx = tx - this.x, tdy = ty - this.y;
        const td = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
        this.x += (tdx / td) * this.spd * dt;
        this.y += (tdy / td) * this.spd * dt;
      } else {
        this.x += (dx / dist) * this.spd * 1.6 * dt;
        this.y += (dy / dist) * this.spd * 1.6 * dt;
      }
    } else if (this.type === 'boss') {
      this.phase += dt;
      const perp = Math.sin(this.phase * 2.2) * 90;
      const perpX = -dy / dist, perpY = dx / dist;
      if (dist > 70) {
        this.x += (dx / dist) * this.spd * dt + perpX * perp * dt;
        this.y += (dy / dist) * this.spd * dt + perpY * perp * dt;
      } else {
        this.x += perpX * perp * dt * 1.5;
        this.y += perpY * perp * dt * 1.5;
      }
    }
    this.x = clamp(this.x, this.r, W - this.r);
    this.y = clamp(this.y, this.r, H - this.r);
  }

  hitLaser() { this.hp--; return this.hp <= 0; }
  dead() { return this.hp <= 0; }

  draw() {
    ctx.save(); ctx.translate(this.x, this.y);
    if      (this.type === 'grunt')   this._grunt();
    else if (this.type === 'charger') this._charger();
    else if (this.type === 'swarmer') this._swarmer();
    else if (this.type === 'boss')    this._boss();
    // HP bar
    if (this.maxHp > 1 && this.type !== 'boss') {
      const bw = this.r * 2.4, bh = 4, bx = -bw / 2, by = -this.r - 9;
      ctx.fillStyle = '#222'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = this.hp / this.maxHp > 0.5 ? '#2ecc71' : '#e74c3c';
      ctx.fillRect(bx, by, bw * (this.hp / this.maxHp), bh);
    }
    ctx.restore();
  }

  _grunt() {
    const b = Math.sin(this.animT) * 2;
    ctx.fillStyle = '#7a0808'; ctx.fillRect(-5, 5 + b, 4, 9); ctx.fillRect(1, 5 + b, 4, 9);
    ctx.fillStyle = this.col; ctx.fillRect(-8, -4, 16, 11);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-7, -15, 14, 13);
    ctx.fillStyle = '#ff0000'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6;
    ctx.fillRect(-4, -11, 3, 3); ctx.fillRect(1, -11, 3, 3);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7a0808'; ctx.fillRect(-13, -2, 6, 4); ctx.fillRect(7, -2, 6, 4);
  }

  _charger() {
    const c = this.charging;
    ctx.save(); ctx.rotate(this.angle);
    ctx.fillStyle = c ? '#ff8800' : this.col;
    if (c) { ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 18; }
    const r = this.r;
    ctx.beginPath();
    ctx.moveTo(r + (c ? Math.sin(this.animT * 4) * 4 : 0), 0);
    ctx.lineTo(-r, -r * 0.85); ctx.lineTo(-r, r * 0.85);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe0b0';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    // Charge buildup glow
    if (!c && this.buildup > 1) {
      const ratio = (this.buildup - 1) / 1.2;
      ctx.strokeStyle = `rgba(255,136,0,${ratio * 0.8})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  _swarmer() {
    const pulse = Math.sin(this.animT * 2.5) * 1.5;
    const offsets = [{ x: -6, y: -4 }, { x: 6, y: -4 }, { x: 0, y: 6 }];
    ctx.shadowColor = this.col; ctx.shadowBlur = 10;
    for (const o of offsets) {
      ctx.fillStyle = this.col;
      ctx.beginPath(); ctx.arc(o.x, o.y, 5 + pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  _boss() {
    const t = this.animT;
    const pulse = Math.sin(t) * 3;

    // Outer orbit ring
    ctx.strokeStyle = this.col; ctx.lineWidth = 2;
    ctx.shadowColor = this.col; ctx.shadowBlur = 16 + pulse;
    ctx.beginPath(); ctx.arc(0, 0, this.r + 8 + pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;

    // Skull body
    ctx.fillStyle = '#0a2e26';
    ctx.beginPath(); ctx.arc(0, -5, 24, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-16, 8, 32, 14);

    // Teeth
    ctx.fillStyle = '#ecf0f1';
    for (let i = -3; i <= 3; i += 2) ctx.fillRect(i * 3.5 - 2, 14, 5, 8);

    // Eye sockets
    ctx.fillStyle = '#072218';
    ctx.beginPath(); ctx.arc(-10, -7, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -7, 8, 0, Math.PI * 2); ctx.fill();

    // Glowing eyes
    ctx.fillStyle = this.col; ctx.shadowColor = this.col; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(-10, -7, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -7, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(-10, -7, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -7, 2.5, 0, Math.PI * 2); ctx.fill();

    // Nose void
    ctx.fillStyle = '#072218';
    ctx.beginPath();
    ctx.moveTo(0, -1); ctx.lineTo(-4, 6); ctx.lineTo(4, 6); ctx.closePath(); ctx.fill();

    // HP bar
    const bw = 80, bh = 7;
    ctx.fillStyle = '#111'; ctx.fillRect(-bw / 2, -this.r - 18, bw, bh);
    const ratio = this.hp / this.maxHp;
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : ratio > 0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(-bw / 2, -this.r - 18, bw * ratio, bh);
    ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1;
    ctx.strokeRect(-bw / 2, -this.r - 18, bw, bh);
    ctx.fillStyle = '#1abc9c'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('BOSS', 0, -this.r - 21);
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function hit(ax, ay, ar, bx, by, br) { return dist2(ax, ay, bx, by) < (ar + br) * (ar + br); }

function edgeSpawn() {
  const s = Math.floor(Math.random() * 4);
  if (s === 0) return { x: Math.random() * W, y: -25 };
  if (s === 1) return { x: W + 25,            y: Math.random() * H };
  if (s === 2) return { x: Math.random() * W, y: H + 25 };
  return         { x: -25,                y: Math.random() * H };
}

// ─── Level config ─────────────────────────────────────────────────────────────
function levelCfg(n) {
  const boss = n % 3 === 0;
  return {
    n, boss,
    total:     boss ? 1 : 4 + n * 2,
    interval:  Math.max(0.48, 2.0 - n * 0.09),
    types:     n === 1 ? ['grunt']
             : n === 2 ? ['grunt', 'grunt', 'charger']
             : n < 5   ? ['grunt', 'charger', 'swarmer']
             :            ['grunt', 'charger', 'swarmer', 'swarmer']
  };
}

// ─── Game state ───────────────────────────────────────────────────────────────
let STATE = 'MENU'; // MENU | PLAYING | LEVEL_COMPLETE | GAME_OVER
let player, enemies, lasers, particles;
let score, lvl, cfg, toSpawn, killed, spawnT;
let lcStats = {}, lcTimer = 0, finalScore = 0;
let menuT = 0, howTo = false;
let menuGhosts = [];

function initMenuGhosts() {
  menuGhosts = Array.from({ length: 8 }, () => {
    const sp = edgeSpawn();
    return { x: sp.x, y: sp.y, type: ['grunt','charger','swarmer'][Math.floor(Math.random()*3)], t: Math.random()*Math.PI*2 };
  });
}

function startGame() {
  score = 0; lvl = 1; player = new Player();
  enemies = []; lasers = []; particles = [];
  beginLevel(1); STATE = 'PLAYING';
}

function beginLevel(n) {
  lvl = n; cfg = levelCfg(n);
  enemies = []; lasers = [];
  toSpawn = cfg.total; killed = 0; spawnT = 0.3;
  if (player) { player.fired = 0; player.hit = 0; }
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(dt) {
  for (const s of stars) { s.y += s.speed; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }

  if (STATE === 'MENU') {
    menuT += dt;
    for (const g of menuGhosts) {
      g.t += dt * 3;
      const a = Math.atan2(H / 2 - g.y, W / 2 - g.x);
      g.x += Math.cos(a) * 28 * dt;
      g.y += Math.sin(a) * 28 * dt;
      if (dist2(g.x, g.y, W/2, H/2) < 60 * 60) {
        const sp = edgeSpawn(); g.x = sp.x; g.y = sp.y;
      }
    }
    return;
  }

  if (STATE === 'LEVEL_COMPLETE') {
    lcTimer -= dt;
    for (const p of particles) { p.update(dt); }
    particles = particles.filter(p => !p.dead());
    return;
  }

  if (STATE === 'GAME_OVER') return;

  // ── PLAYING ────────────────────────────────────────────────────────────────
  player.update(dt);

  if (mouse.fired) {
    const l = player.shoot();
    if (l) lasers.push(l);
    mouse.fired = false;
  }

  // Spawn
  if (toSpawn > 0) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = cfg.interval;
      let type;
      if (cfg.boss) { type = 'boss'; }
      else { type = cfg.types[Math.floor(Math.random() * cfg.types.length)]; }

      if (type === 'swarmer') {
        for (let i = 0; i < 3; i++) {
          const sp = edgeSpawn();
          enemies.push(new Enemy(sp.x, sp.y, 'swarmer', lvl));
        }
      } else {
        const sp = edgeSpawn();
        enemies.push(new Enemy(sp.x, sp.y, type, lvl));
      }
      toSpawn--;
    }
  }

  for (const l of lasers) l.update(dt);
  for (const e of enemies) e.update(dt, player.x, player.y);
  for (const p of particles) p.update(dt);

  // Laser ↔ enemy
  for (const l of lasers) {
    if (l.dead()) continue;
    for (const e of enemies) {
      if (e.dead()) continue;
      if (hit(l.x, l.y, l.r, e.x, e.y, e.r)) {
        l.life = 0; player.hit++;
        burst(e.x, e.y, e.col, 5);
        if (e.hitLaser()) {
          score += e.pts; killed++;
          burst(e.x, e.y, e.col, 16, true);
        }
        break;
      }
    }
  }

  // Enemy ↔ player
  for (const e of enemies) {
    if (e.dead()) continue;
    if (hit(e.x, e.y, e.r, player.x, player.y, player.r)) {
      if (player.damage()) {
        if (player.hp <= 0) { finalScore = score; STATE = 'GAME_OVER'; return; }
      }
    }
  }

  lasers  = lasers.filter(l => !l.dead());
  enemies = enemies.filter(e => !e.dead());
  particles = particles.filter(p => !p.dead());

  // Level complete?
  if (toSpawn <= 0 && enemies.length === 0) {
    const acc = player.fired > 0 ? Math.round((player.hit / player.fired) * 100) : 0;
    lcStats = { n: lvl, score, killed, acc };
    lcTimer = 4;
    STATE = 'LEVEL_COMPLETE';
    burst(W/2, H/2, '#ff00ff', 20, true);
    burst(W/4, H/3, '#00ffff', 14, true);
    burst(3*W/4, H/3, '#ffff00', 14, true);
  }
}

// ─── Draw helpers ─────────────────────────────────────────────────────────────
function drawBG() {
  ctx.fillStyle = '#080812'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(20,40,70,0.5)'; ctx.lineWidth = 1;
  const g = 55;
  for (let x = 0; x < W; x += g) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += g) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.25 + s.size * 0.18})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
}

function drawCRT() {
  for (let y = 0; y < H; y += 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(0, y, W, 1);
  }
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'transparent'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawHUD() {
  // Hearts
  ctx.font = '22px serif';
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? '#e74c3c' : '#2a0808';
    ctx.fillText('♥', 12 + i * 28, 32);
  }
  // Score
  ctx.fillStyle = '#00ffff'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SCORE  ' + score, W / 2, 28);
  // Level
  ctx.fillStyle = '#ffff00'; ctx.textAlign = 'right';
  ctx.fillText('LVL ' + lvl, W - 12, 28);
  // Wave bar
  const tot = cfg.total, bw = 220, bh = 7;
  const bx = W/2 - bw/2, by = H - 20;
  ctx.fillStyle = '#111'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
  const ratio = clamp(killed / tot, 0, 1);
  const barCol = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  barCol.addColorStop(0, '#2ecc71'); barCol.addColorStop(1, '#00ffff');
  ctx.fillStyle = barCol; ctx.fillRect(bx, by, bw * ratio, bh);
  ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#888'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText(killed + ' / ' + tot + ' enemies', W/2, H - 24);
  ctx.textAlign = 'left';
}

function drawMenu() {
  drawBG();
  // Ghost enemies drifting in bg
  for (const g of menuGhosts) {
    ctx.save(); ctx.translate(g.x, g.y); ctx.globalAlpha = 0.18;
    if (g.type === 'grunt') {
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(-8,-8,16,22);
    } else if (g.type === 'charger') {
      ctx.fillStyle = '#e67e22';
      ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,-10); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#9b59b6';
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
  }

  // Title flicker
  const flk = Math.sin(menuT * 14) > 0.88 ? 0.65 : 1;
  ctx.save();
  ctx.textAlign = 'center';

  ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 35;
  ctx.fillStyle = `rgba(255,0,255,${flk})`;
  ctx.font = 'bold 72px monospace';
  ctx.fillText('GUITAR', W/2, H/2 - 75);

  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 35;
  ctx.fillStyle = `rgba(0,255,255,${flk})`;
  ctx.fillText('BLASTER', W/2, H/2 - 3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ffff00'; ctx.font = '13px monospace';
  ctx.fillText('— RETRO TOP-DOWN SHOOTER —', W/2, H/2 + 24);

  if (Math.sin(menuT * 2.2) > 0) {
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px monospace';
    ctx.fillText('PRESS  ENTER  OR  CLICK  TO  PLAY', W/2, H/2 + 68);
  }
  ctx.fillStyle = '#555'; ctx.font = '12px monospace';
  ctx.fillText('[H]  HOW TO PLAY', W/2, H/2 + 96);

  if (howTo) {
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(W/2 - 210, H/2 + 110, 420, 138);
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1;
    ctx.strokeRect(W/2 - 210, H/2 + 110, 420, 138);
    ctx.fillStyle = '#00ffff'; ctx.font = '13px monospace';
    const lines = [
      '← → ↑ ↓       Move',
      'MOUSE           Aim guitar-gun',
      'LEFT CLICK      Fire laser',
      'Survive all waves to clear a level',
      'Boss appears every 3rd level!'
    ];
    lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 + 132 + i * 22));
  }

  ctx.restore();
  drawCRT();
}

function drawLevelComplete() {
  drawBG();
  for (const p of particles) p.draw();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.textAlign = 'center';
  ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 28;
  ctx.fillStyle = '#ffff00'; ctx.font = 'bold 56px monospace';
  ctx.fillText('LEVEL  ' + lcStats.n, W/2, H/2 - 70);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 40px monospace';
  ctx.fillText('CLEAR!', W/2, H/2 - 18);
  ctx.shadowBlur = 0;

  ctx.font = '17px monospace'; ctx.fillStyle = '#aaa';
  ctx.fillText('Score      ' + lcStats.score,   W/2, H/2 + 24);
  ctx.fillText('Enemies    ' + lcStats.killed,   W/2, H/2 + 46);
  ctx.fillText('Accuracy   ' + lcStats.acc + '%', W/2, H/2 + 68);

  if (Math.sin(Date.now() / 380) > 0) {
    ctx.fillStyle = '#00ffff'; ctx.font = 'bold 13px monospace';
    ctx.fillText('CLICK  OR  ENTER  TO  CONTINUE', W/2, H/2 + 106);
  }
  ctx.restore();
  drawCRT();
}

function drawGameOver() {
  drawBG();
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.textAlign = 'center';
  ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 45;
  ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 80px monospace';
  ctx.fillText('GAME', W/2, H/2 - 55);
  ctx.fillText('OVER', W/2, H/2 + 30);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffff00'; ctx.font = 'bold 22px monospace';
  ctx.fillText('Final Score:  ' + finalScore, W/2, H/2 + 82);
  if (Math.sin(Date.now() / 400) > 0) {
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('CLICK  OR  ENTER  TO  PLAY  AGAIN', W/2, H/2 + 118);
  }
  ctx.restore();
  drawCRT();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (STATE === 'MENU')           { drawMenu();         return; }
  if (STATE === 'LEVEL_COMPLETE') { drawLevelComplete(); return; }
  if (STATE === 'GAME_OVER')      { drawGameOver();     return; }

  drawBG();
  for (const p of particles) p.draw();
  for (const l of lasers)    l.draw();
  for (const e of enemies)   e.draw();
  player.draw();
  drawHUD();
  drawCRT();
}

// ─── Input handlers ───────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'h' || e.key === 'H') { howTo = !howTo; return; }
  if (e.key === 'Enter' || e.key === ' ') {
    if (STATE === 'MENU')           { startGame(); }
    else if (STATE === 'LEVEL_COMPLETE') { beginLevel(lvl + 1); STATE = 'PLAYING'; }
    else if (STATE === 'GAME_OVER') { startGame(); }
  }
  // Block arrow scrolling
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top)  * (H / r.height);
});

canvas.addEventListener('click', e => {
  if (STATE === 'MENU')           { startGame(); return; }
  if (STATE === 'LEVEL_COMPLETE') { beginLevel(lvl + 1); STATE = 'PLAYING'; return; }
  if (STATE === 'GAME_OVER')      { startGame(); return; }
  mouse.fired = true;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─── Main loop ────────────────────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

initMenuGhosts();
requestAnimationFrame(loop);
</script>
</body>
</html>
